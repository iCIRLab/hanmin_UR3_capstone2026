# Shared conservative limits for MPlib, MoveIt 2, MuJoCo, and trajectory checks.
#
# Position limits follow the UR3 description. wrist_3_joint is physically
# continuous, but MPlib 0.2.1 cannot construct an OMPL planner with a continuous
# revolute joint. The common planning range is therefore bounded to one full
# turn in either direction. This does not alter the calibrated source URDF.
joint_limits:
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5
  elbow_joint:
    has_position_limits: true
    min_position: -3.141592653589793
    max_position: 3.141592653589793
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5
  wrist_1_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5
  wrist_2_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5
  wrist_3_joint:
    has_position_limits: true
    min_position: -6.283185307179586
    max_position: 6.283185307179586
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5

